name: Build unsigned Pixon app

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build DMG
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          XCODE_APP="$({ find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print || true; } | head -n 1)"
          if [[ -z "$XCODE_APP" ]]; then
            echo "Xcode 26 is not installed on this runner." >&2
            exit 1
          fi

          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE_APP/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set automatic version
        run: |
          set -euo pipefail
          BASE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          bash .github/scripts/version.sh "$BASE_VERSION" > build-version.env
          cat build-version.env >> "$GITHUB_ENV"
          source build-version.env
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_VERSION" App/Info.plist
          echo "Pixon $APP_VERSION (build $BUILD_VERSION)"

      - name: Build Release app
        run: |
          set -euo pipefail

          xcodebuild \
            -project ELEnglish.xcodeproj \
            -scheme ELEnglish \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify app architecture
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release/Pixon.app"
          test -d "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")" = "$BUILD_VERSION"
          file "$APP_PATH/Contents/MacOS/Pixon"
          lipo -info "$APP_PATH/Contents/MacOS/Pixon"

      - name: Create DMG
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release/Pixon.app"
          STAGING_DIR="build/dmg-staging"
          OUTPUT_PATH="build/$DMG_NAME"

          mkdir -p "$STAGING_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/Pixon.app"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create \
            -volname Pixon \
            -srcfolder "$STAGING_DIR" \
            -format UDZO \
            -ov \
            "$OUTPUT_PATH"
          hdiutil verify "$OUTPUT_PATH"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: Pixon-${{ env.APP_VERSION }}-build-${{ env.BUILD_VERSION }}-unsigned
          path: build/${{ env.DMG_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "build/$DMG_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "build/$DMG_NAME" \
              --target "$GITHUB_SHA" \
              --title "Pixon $APP_VERSION (test build $BUILD_VERSION)" \
              --notes "Download $DMG_NAME below. App version: $APP_VERSION; build: $BUILD_VERSION. Universal app for Apple Silicon and Intel; requires macOS 15 or later. This test build has no Developer ID signature or Apple notarization. Source commit: $GITHUB_SHA." \
              --prerelease \
              --latest=false
          fi

          RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          echo "### Pixon download" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download DMG from GitHub Releases]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
